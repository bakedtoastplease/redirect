<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка...</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #000; color: white; font-family: sans-serif; }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
        #status { padding: 20px; text-align: center; }
    </style>
</head>
<body>
    <div id="status">Обработка данных...</div>

    <script>
        async function doRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const linkId = urlParams.get('id');
            const statusDiv = document.getElementById('status');

            if (!linkId) {
                statusDiv.innerHTML = "Ошибка: ID не указан.";
                return;
            }

            const fileUrl = 'https://raw.githubusercontent.com/bakedtoastplease/redirect/refs/heads/main/redirect.txt';

            try {
                const response = await fetch(fileUrl);
                const data = await response.text();
                const lines = data.split('\n');
                
                let content = '';

                for (let line of lines) {
                    let trimmedLine = line.trim();
                    if (trimmedLine.startsWith(`id=${linkId}`)) {
                        // Забираем всё, что после первого пробела
                        content = trimmedLine.substring(trimmedLine.indexOf(' ') + 1);
                        break;
                    }
                }

                if (content) {
                    if (content.startsWith('data:image')) {
                        // Если это картинка в Base64 — показываем её
                        document.body.innerHTML = `<img src="${content}" alt="Redirect Image">`;
                        document.title = "Просмотр изображения";
                    } else if (content.startsWith('http')) {
                        // Если это обычная ссылка — переходим
                        window.location.replace(content);
                    } else {
                        statusDiv.innerHTML = "Формат данных не распознан.";
                    }
                } else {
                    statusDiv.innerHTML = "ID не найден в базе.";
                }
            } catch (error) {
                statusDiv.innerHTML = "Ошибка загрузки данных.";
            }
        }

        doRedirect();
    </script>
</body>
</html>
