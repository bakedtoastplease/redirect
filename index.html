<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Перенаправление...</title>
</head>
<body>
    <div id="status">Загрузка...</div>

    <script>
        async function doRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const linkId = urlParams.get('id'); // Например, "1"
            const statusDiv = document.getElementById('status');

            if (!linkId) {
                statusDiv.innerHTML = "Ошибка: ID не указан (добавьте ?id=...)";
                return;
            }

            // Ваша ссылка на файл
            const fileUrl = 'https://raw.githubusercontent.com/bakedtoastplease/redirect/refs/heads/main/redirect.txt';

            try {
                const response = await fetch(fileUrl);
                const data = await response.text();
                const lines = data.split('\n');
                
                let targetUrl = '';

                // Ищем строку, которая начинается с "id=1"
                const searchPattern = `id=${linkId}`; 
                
                for (let line of lines) {
                    let trimmedLine = line.trim();
                    if (trimmedLine.startsWith(searchPattern)) {
                        // Забираем всё, что идет после "id=1 "
                        // Используем split(' ') и берем последний элемент (ссылку)
                        const parts = trimmedLine.split(' ');
                        targetUrl = parts[parts.length - 1]; 
                        break;
                    }
                }

                if (targetUrl && targetUrl.startsWith('http')) {
                    window.location.replace(targetUrl);
                } else {
                    statusDiv.innerHTML = `Ссылка для ID "${linkId}" не найдена в файле или имеет неверный формат.`;
                }
            } catch (error) {
                statusDiv.innerHTML = "Ошибка подключения к GitHub.";
                console.error(error);
            }
        }

        doRedirect();
    </script>
</body>
</html>
